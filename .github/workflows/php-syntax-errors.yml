name: PHP Syntax Errors

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

permissions:
  contents: read

jobs:
  lint-php-files:
    strategy:
      matrix:
        php: [ 8.2, 8.3, 8.4 ] # Include all PHP versions between the site's current version and the latest release version.

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup proper PHP version
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}

      - name: Check all files for syntax errors
        run: find -L "$GITHUB_WORKSPACE" -name '*.php' -print0 | xargs -0 -n 1 -P 4 php -l
