name: Codex Auto Fix and PR

on:
  issues:
    types: [labeled]

jobs:
  codex_fix:
    if: github.event.label.name == 'codex-fix'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'node'

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Set environment variable for OpenAI key
        run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_KEY }}" >> $GITHUB_ENV

      - name: Run Codex with issue text
        run: |
          codex -a auto-edit --quiet "${{ github.event.issue.body }}"

      - name: Create a new branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b codex/issue-${{ github.event.issue.number }}
          git add .
          git commit -m "fix: apply Codex changes for issue #${{ github.event.issue.number }}"
          git push origin codex/issue-${{ github.event.issue.number }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Codex: Fix for issue #${{ github.event.issue.number }}"
          body: |
            This pull request was automatically generated by Codex after the 'codex-fix' label was applied to issue #${{ github.event.issue.number }}.
            
            Original issue: ${{ github.event.issue.html_url }}
          branch: codex/issue-${{ github.event.issue.number }}
