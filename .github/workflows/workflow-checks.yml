name: Workflow Checks

on:
  push:
    branches: [trunk]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  schedule:
    # Weekly Monday 06:00 UTC. Keeps zizmor's online audits (e.g.
    # known-vulnerable-actions) fresh between workflow changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Advisory during rollout: seeded workflows carry pre-existing lint debt.
      # Surfaces findings without failing CI; flip to blocking once they're clean.
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        continue-on-error: true

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # SARIF upload to the Security tab on public repos (free code scanning).
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Adapts to the repo: public repos (this scaffold, or any public project
      # scaffolded from it) get free code scanning, so zizmor uploads SARIF to the
      # Security tab. Private projects on the Free plan have no code scanning, so it
      # runs advisory -- findings print in the Actions log and never fail CI.
      # online-audits disabled: the repo-sync-managed poseidon.yaml references
      # a8cteam51/poseidon-actions/*@trunk, which the scoped CI token can't resolve
      # cross-repo (zizmor's online ref-confusion audit errors out). Offline audits run.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa
        continue-on-error: ${{ github.event.repository.visibility != 'public' }}
        with:
          # Scope to this repo's own workflows -- don't audit third-party CI
          # files a scaffolded project may commit under vendor/ or node_modules/.
          inputs: .github/workflows
          advanced-security: ${{ github.event.repository.visibility == 'public' }}
          online-audits: false
