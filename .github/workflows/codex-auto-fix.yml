name: Codex Auto Fix and PR

on:
  issues:
    types: [labeled]

jobs:
  codex_fix:
    if: github.event.label.name == 'codex-fix'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'node'

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Set environment variable for OpenAI key
        run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_KEY }}" >> $GITHUB_ENV

      - name: Extract and validate issue details
        id: issue_info
        run: |
          echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
          echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
          
          cat << 'EOF' > issue_body.txt
          ${{ github.event.issue.body }}
          EOF
          
          if [ ! -s issue_body.txt ]; then
            echo "Error: Issue body is empty. Cannot proceed with Codex processing."
            exit 1
          fi
          
          echo "Issue content extracted successfully"

      - name: Run Codex with issue content
        run: |
          ISSUE_BODY=$(cat issue_body.txt)
          echo "Running Codex with issue content..."
          codex -a auto-edit --quiet "$ISSUE_BODY"

      - name: Create branch and commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          SANITIZED_TITLE=$(echo '${{ github.event.issue.title }}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g' | cut -c1-50)
          BRANCH_NAME="codex/issue-${{ github.event.issue.number }}-${SANITIZED_TITLE}"
          
          git checkout -b "$BRANCH_NAME"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes were made by Codex. Exiting without creating PR."
            exit 0
          fi
          
          git commit -m "fix: address issue #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          git push origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Fix: ${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          body: |
            This pull request was automatically generated by Codex to address issue #${{ github.event.issue.number }}.
            
            **Original Issue:**
            ${{ github.event.issue.title }}
            
            **Issue Description:**
            ${{ github.event.issue.body }}
            
            **Changes:**
            Codex has analyzed the issue description and made the necessary code changes to address the requirements.
            
            **Review Notes:**
            - Please review all changes carefully before merging
            - Test the changes in your development environment
            - Verify that the changes address the original issue requirements
          branch: ${{ env.BRANCH_NAME }}
